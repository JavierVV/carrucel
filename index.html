<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum-scale="1.0", minimum-scale="1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Document</title>
</head>
<body>
    <div class="container-all">
        <input type="radio" name="image-slide" id="1" hidden>
        <input type="radio" name="image-slide" id="2" hidden>
        <input type="radio" name="image-slide" id="3" hidden>
        <input type="radio" name="image-slide" id="4" hidden>
        <input type="radio" name="image-slide" id="5" hidden>

        <div class="slide">
            <div class="item-slide">
                <img src="image/1.jpg" alt="" srcset="">
            </div>

            <div class="item-slide">
                <img src="image/2.jpg" alt="" srcset="">
            </div>

            <div class="item-slide">
                <img src="image/3.jpg" alt="" srcset="">
            </div>

            <div class="item-slide">
                <img src="image/4.jpg" alt="" srcset="">
            </div>

            <div class="item-slide">
                <img src="image/5.jpg" alt="" srcset="">
            </div>

        </div>
        <div class="pagina">
            <div class="pagina-ite" for="1">
                <img src="image/1.jpg" alt="" srcset="">
            </div>

            <div class="pagina-ite" for="1">
                <img src="image/2.jpg" alt="" srcset="">
            </div>

            <div class="pagina-ite" for="1">
                <img src="image/3.jpg" alt="" srcset="">
            </div>

            <div class="pagina-ite" for="1">
                <img src="image/4.jpg" alt="" srcset="">
            </div>

            <div class="pagina-ite" for="1">
                <img src="image/5.jpg" alt="" srcset="">
            </div>
        </div>
    </div>
    
</body>
</html>
